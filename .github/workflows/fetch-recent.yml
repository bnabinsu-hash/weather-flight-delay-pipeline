name: fetch-recent-data

# Downloads 2024-2025 flights (BTS) and airport weather (IEM ASOS) for EWR, JFK
# and LGA, then commits the snapshot to snapshots/nyc2024_25/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_recent.py
      - .github/workflows/fetch-recent.yml

permissions:
  contents: write

concurrency:
  group: fetch-recent
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Download and build snapshot
        run: python scripts/fetch_recent.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/nyc2024_25
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update 2024-2025 data snapshot [skip ci]"
            git pull --rebase
            git push
          fi
